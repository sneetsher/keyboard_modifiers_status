on:
  pull_request:
    branches:
      - master
  push:
    branches:
    - master

jobs:
  shexli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: requirements
        run: |
          sudo apt update
          sudo apt install --no-install-recommends gnome-shell build-essential

      - name: Build extension
        run: make pack

      - uses: 3v1n0/shexli-ci@main
        with:
          path: keyboard_modifiers_status@sneetsher.shell-extension.zip
          baseline: shexli-baseline.json
